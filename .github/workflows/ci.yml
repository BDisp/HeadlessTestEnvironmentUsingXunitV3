name: CI - Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK (use .NET 10 preview if required)
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
          include-prerelease: false

      - name: Display dotnet information
        run: dotnet --info

      - name: Restore NuGet packages
        run: dotnet restore HeadlessTestEnvironmentUsingXunitV3.slnx

      - name: Build solution
        run: dotnet build HeadlessTestEnvironmentUsingXunitV3.slnx -c Release --no-restore

      - name: Run unit tests
        run: dotnet test HeadlessTestEnvironmentUsingXunitV3.Tests/HeadlessTestEnvironmentUsingXunitV3.Tests.csproj -c Release --verbosity normal
