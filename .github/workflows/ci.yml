name: CI - Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK (use .NET 10 preview if required)
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
          include-prerelease: false

      - name: Display dotnet information
        run: dotnet --info

      - name: Restore NuGet packages
        run: dotnet restore HeadlessTestEnvironmentUsingXunitV3.slnx

      - name: Build solution
        run: dotnet build HeadlessTestEnvironmentUsingXunitV3.slnx -c Release --no-restore

      - name: Run unit tests
        run: dotnet test HeadlessTestEnvironmentUsingXunitV3.Tests/HeadlessTestEnvironmentUsingXunitV3.Tests.csproj -c Release --verbosity normal

      - name: Print diagnostic files
        if: always()
        shell: pwsh
        run: |
          $diagnosticDirectory = "HeadlessTestEnvironmentUsingXunitV3.Tests/bin/Release/net10.0"
          $diagnosticFiles = Get-ChildItem -Path $diagnosticDirectory -Filter "Diagnostic_PrintProcessInfo_*.txt" -File -ErrorAction SilentlyContinue

          if (-not $diagnosticFiles) {
            Write-Host "No diagnostic files found in $diagnosticDirectory"
            exit 0
          }

          foreach ($file in $diagnosticFiles) {
            Write-Host "::group::Contents of $($file.Name)"
            Get-Content -LiteralPath $file.FullName
            Write-Host "::endgroup::"
          }
